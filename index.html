<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<meta name="theme-color" content="#0f1020" />
<title>Orbit Merge — Puzzles</title>
<style>
  :root{ --bg0:#0b0c1d; --ink:#eef1ff; --muted:#b6bbe8; --accent:#ffd45e; --danger:#ff5d73; --good:#5fd6a6; }
  *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body{ margin:0; height:100%; }
  body{
    font-family:"Segoe UI", system-ui, -apple-system, Roboto, Helvetica, Arial, sans-serif;
    color:var(--ink);
    background:
      radial-gradient(1200px 700px at 50% -10%, #25275e 0%, transparent 60%),
      radial-gradient(900px 600px at 10% 110%, #1a1c45 0%, transparent 60%),
      linear-gradient(180deg, var(--bg0), #060713);
    background-attachment:fixed; overflow:hidden; touch-action:none; user-select:none;
  }
  #app{ position:fixed; inset:0; display:flex; flex-direction:column; align-items:center; gap:8px; padding:10px; }
  header{ width:100%; max-width:460px; display:flex; align-items:center; justify-content:space-between; gap:10px; }
  .brand{ display:flex; align-items:center; gap:10px; }
  .brand .logo{ width:30px; height:30px; border-radius:50%;
    background:radial-gradient(circle at 35% 30%, #fff7d6, #ffb43d 55%, #d4720e 100%); box-shadow:0 0 16px rgba(255,180,61,.6); }
  .brand h1{ font-size:17px; margin:0; font-weight:800; letter-spacing:.3px; }
  .brand small{ display:block; font-size:9px; color:var(--muted); letter-spacing:2px; text-transform:uppercase; }
  .iconbtn{ width:42px;height:42px;border-radius:12px;display:flex;align-items:center;justify-content:center;
    background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.1);cursor:pointer;font-size:18px;color:var(--ink);appearance:none;}
  .iconbtn:active{ transform:scale(.94); }

  /* In-level goal bar */
  .goalbar{ width:100%; max-width:460px; display:flex; align-items:center; justify-content:space-between;
    background:rgba(255,255,255,.05); border:1px solid rgba(255,255,255,.08); border-radius:14px; padding:8px 14px; }
  .goalbar .g-goal{ font-size:14px; font-weight:700; }
  .goalbar .g-goal b{ color:var(--accent); }
  .goalbar .g-stat{ text-align:center; }
  .goalbar .g-stat .lab{ font-size:9px; color:var(--muted); letter-spacing:1.5px; text-transform:uppercase; }
  .goalbar .g-stat .val{ font-size:18px; font-weight:800; line-height:1; }
  .goalbar .g-stat .val.low{ color:var(--danger); }

  .stage{ position:relative; }
  canvas{ display:block; border-radius:18px; background:linear-gradient(180deg, rgba(255,255,255,.03), rgba(0,0,0,.18));
    box-shadow:0 20px 50px rgba(0,0,0,.5), inset 0 0 0 1px rgba(255,255,255,.06); touch-action:none; }

  .overlay{ position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center;
    gap:14px; text-align:center; padding:22px; border-radius:18px;
    background:radial-gradient(closest-side, rgba(10,11,29,.82), rgba(6,7,19,.95)); backdrop-filter:blur(4px);
    opacity:0; pointer-events:none; transition:opacity .3s ease; }
  .overlay.show{ opacity:1; pointer-events:auto; }
  .overlay h2{ margin:0; font-size:28px; }
  .overlay p{ margin:0; color:var(--muted); max-width:300px; line-height:1.5; font-size:14px; }
  .stars{ font-size:34px; letter-spacing:4px; }
  button.cta{ border:none; cursor:pointer; font-weight:800; font-size:16px; color:#1a1300; padding:13px 24px; border-radius:14px;
    background:linear-gradient(180deg,#ffe48a,#ffc23d); box-shadow:0 8px 20px rgba(255,180,61,.4), inset 0 1px 0 rgba(255,255,255,.6); }
  button.cta:active{ transform:translateY(2px) scale(.98); }
  .ghost{ background:rgba(255,255,255,.08); color:var(--ink); border:1px solid rgba(255,255,255,.14);
    border-radius:12px; padding:10px 16px; cursor:pointer; font-weight:700; font-size:13px; }
  .row{ display:flex; gap:10px; align-items:center; justify-content:center; flex-wrap:wrap; }

  /* Level select */
  #levelSelect{ width:100%; max-width:460px; display:none; flex-direction:column; align-items:center; gap:12px; }
  #levelSelect.show{ display:flex; }
  #levelSelect h2{ margin:6px 0 0; font-size:22px; }
  #levelSelect .sub{ color:var(--muted); font-size:13px; margin-bottom:2px; }
  .levels{ display:grid; grid-template-columns:repeat(4, 1fr); gap:12px; width:100%; }
  .lvl{ aspect-ratio:1/1; border-radius:16px; background:rgba(255,255,255,.06); border:1px solid rgba(255,255,255,.1);
    display:flex; flex-direction:column; align-items:center; justify-content:center; gap:3px; cursor:pointer; position:relative; }
  .lvl .num{ font-size:24px; font-weight:800; }
  .lvl .st{ font-size:12px; letter-spacing:1px; color:var(--accent); height:14px; }
  .lvl.locked{ opacity:.4; cursor:not-allowed; }
  .lvl.locked .num{ font-size:18px; }
  .lvl:not(.locked):active{ transform:scale(.95); }

  .hint{ font-size:12px; color:var(--muted); margin-top:2px; text-align:center; max-width:440px; }
  footer{ font-size:11px; color:var(--muted); opacity:.8; margin-top:auto; padding-bottom:4px; }
  .hidden{ display:none !important; }
</style>
</head>
<body>
<div id="app">
  <header>
    <div class="brand">
      <div class="logo"></div>
      <div><h1>Orbit Merge</h1><small>puzzles</small></div>
    </div>
    <div class="row">
      <div class="iconbtn" id="homeBtn" title="Levels">☰</div>
      <div class="iconbtn" id="soundBtn" title="Sound">🔊</div>
    </div>
  </header>

  <!-- LEVEL SELECT -->
  <div id="levelSelect" class="show">
    <h2>Choose a level</h2>
    <div class="sub">Merge to the goal — but you only get so many drops.</div>
    <div class="levels" id="levelGrid"></div>
  </div>

  <!-- GAME -->
  <div id="gameWrap" class="hidden" style="display:flex;flex-direction:column;align-items:center;gap:8px;">
    <div class="goalbar">
      <div class="g-goal" id="goalText">Goal</div>
      <div class="g-stat"><div class="lab">Moves</div><div class="val" id="movesVal">0</div></div>
      <div class="g-stat"><div class="lab">Score</div><div class="val" id="scoreVal">0</div></div>
    </div>
    <div class="stage">
      <canvas id="game" width="380" height="548"></canvas>
      <div class="overlay" id="winScreen">
        <h2 style="color:var(--good)">Solved!</h2>
        <div class="stars" id="winStars">★★★</div>
        <p id="winMsg">Nice merging.</p>
        <div class="row">
          <button class="ghost" id="winRetry">Retry</button>
          <button class="cta" id="winNext">Next ›</button>
        </div>
      </div>
      <div class="overlay" id="loseScreen">
        <h2 style="color:var(--danger)">Out of moves</h2>
        <p id="loseMsg">So close — try a different order.</p>
        <div class="row">
          <button class="ghost" id="loseMenu">Levels</button>
          <button class="cta" id="loseRetry">Retry</button>
        </div>
      </div>
    </div>
    <div class="hint" id="hintText">Tap a column to drop. Connect 2+ of the same to merge up.</div>
  </div>

  <footer>Made with ♥ — a casual merge puzzle.</footer>
</div>

<script>
(() => {
"use strict";

// ---------- DOM ----------
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
const levelSelect = document.getElementById('levelSelect');
const levelGrid = document.getElementById('levelGrid');
const gameWrap = document.getElementById('gameWrap');
const goalText = document.getElementById('goalText');
const movesVal = document.getElementById('movesVal');
const scoreVal = document.getElementById('scoreVal');
const winScreen = document.getElementById('winScreen');
const loseScreen = document.getElementById('loseScreen');
const winStars = document.getElementById('winStars');
const winMsg = document.getElementById('winMsg');
const hintText = document.getElementById('hintText');
const soundBtn = document.getElementById('soundBtn');

// ---------- safe storage ----------
const mem = {};
function storeGet(k){ try{ const v=localStorage.getItem(k); return v===null?(k in mem?mem[k]:null):v; }catch(e){ return k in mem?mem[k]:null; } }
function storeSet(k,v){ mem[k]=v; try{ localStorage.setItem(k,v); }catch(e){} }

// ---------- sound ----------
let audioOn = (storeGet('orbitmerge.sound') !== 'off');
let actx = null;
soundBtn.textContent = audioOn ? '🔊' : '🔇';
function ensureAudio(){ if(!actx){ try{ actx = new (window.AudioContext||window.webkitAudioContext)(); }catch(e){} }
  if(actx && actx.state==='suspended') actx.resume().catch(()=>{}); }
function blip(freq,dur=0.08,type='sine',vol=0.16){
  if(!audioOn||!actx) return;
  const t=actx.currentTime, o=actx.createOscillator(), g=actx.createGain();
  o.type=type; o.frequency.setValueAtTime(freq,t);
  g.gain.setValueAtTime(0.0001,t); g.gain.exponentialRampToValueAtTime(vol,t+0.01); g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
  o.connect(g).connect(actx.destination); o.start(t); o.stop(t+dur+0.02);
}
const MERGE_SCALE=[0,2,4,7,9,12,14,16,19,21];
function mergeSound(tier,step=0){ const f=261.63*Math.pow(2,(MERGE_SCALE[Math.min(tier,9)]+step*2)/12); blip(f,0.10,'triangle',0.2); }
function dropSound(){ blip(170,0.05,'sine',0.1); }
soundBtn.addEventListener('click', ()=>{ audioOn=!audioOn; soundBtn.textContent=audioOn?'🔊':'🔇';
  storeSet('orbitmerge.sound', audioOn?'on':'off'); if(audioOn){ ensureAudio(); blip(440,0.08,'sine',0.14);} });

// ---------- tiers (visual) ----------
const TIERS = [
  { color:'#ff7a9c', glow:'#ff4d78' }, { color:'#ff9f68', glow:'#ff7a3c' },
  { color:'#ffd45e', glow:'#ffbe2e' }, { color:'#b6e06b', glow:'#8fd13f' },
  { color:'#5fd6a6', glow:'#2fc488' }, { color:'#52c7ff', glow:'#1ea7ff' },
  { color:'#7c8bff', glow:'#5566ff' }, { color:'#b886ff', glow:'#9a55ff' },
  { color:'#ff7ad9', glow:'#ff3dc0' }, { color:'#fff1a8', glow:'#ffd84d' },
];
const MAX_TIER = TIERS.length - 1;

// ---------- LEVELS ----------
// Every level: fixed 5x7 grid. goal {type:'reach'|'score'|'clear', n}. moves. pool of spawnable tiers.
// stones: array of [row,col] blockers (hp 1). seed → deterministic orb sequence.
const COLS = 5, ROWS = 7;
const LEVELS = [
  { id:1,  seed:7,   moves:16, pool:[0,1],     goal:{type:'reach', n:3}, stones:[] },
  { id:2,  seed:23,  moves:18, pool:[0,1,1],   goal:{type:'reach', n:4}, stones:[] },
  { id:3,  seed:51,  moves:18, pool:[0,1,2],   goal:{type:'score', n:500}, stones:[] },
  { id:4,  seed:88,  moves:16, pool:[0,1,2],   goal:{type:'clear', n:0}, stones:[[6,2],[5,2],[6,1]] },
  { id:5,  seed:140, moves:22, pool:[0,1,2],   goal:{type:'reach', n:5}, stones:[] },
  { id:6,  seed:202, moves:18, pool:[0,1,2],   goal:{type:'score', n:1200}, stones:[[6,0],[6,4]] },
  { id:7,  seed:265, moves:24, pool:[0,1,2],   goal:{type:'clear', n:0}, stones:[[6,2],[5,2],[6,1],[6,3]] },
  { id:8,  seed:333, moves:30, pool:[0,1,2,3], goal:{type:'reach', n:6}, stones:[] },
  { id:9,  seed:404, moves:26, pool:[0,1,2],   goal:{type:'score', n:2000}, stones:[[6,1],[6,2],[6,3]] },
  { id:10, seed:480, moves:26, pool:[0,1,2,3], goal:{type:'reach', n:5}, stones:[[3,2]] },
  { id:11, seed:560, moves:24, pool:[0,1,2],   goal:{type:'clear', n:0}, stones:[[6,0],[5,0],[6,4],[5,4],[6,2]] },
  { id:12, seed:640, moves:34, pool:[0,1,2,3], goal:{type:'score', n:2400}, stones:[[6,0],[6,4]] },
];

// ---------- progress ----------
function loadProgress(){
  try{ return JSON.parse(storeGet('orbitmerge.puzzle')||'') || {unlocked:1,stars:{}}; }
  catch(e){ return {unlocked:1, stars:{}}; }
}
function saveProgress(){ storeSet('orbitmerge.puzzle', JSON.stringify(progress)); }
let progress = loadProgress();
if(!progress.unlocked) progress.unlocked = 1;
if(!progress.stars) progress.stars = {};

// ---------- layout ----------
const W = 380, H = 548;
const TOP = 86;                       // area above the grid for the current orb
const cell = Math.floor(Math.min((W-32)/COLS, (H-TOP-16)/ROWS));
const gridW = cell*COLS, gridH = cell*ROWS;
const gridX = Math.round((W - gridW)/2);
const gridY = TOP;
function cellCX(c){ return gridX + c*cell + cell/2; }
function cellCY(r){ return gridY + r*cell + cell/2; }
const ORB_R = Math.floor(cell*0.42);

// ---------- game state ----------
let level = null;
function emptyGrid(){ const g=[]; for(let r=0;r<ROWS;r++){ const row=[]; for(let c=0;c<COLS;c++) row.push(null); g.push(row); } return g; }
let grid = emptyGrid();  // grid[r][c] = orb {tier, py, pop} | stone {stone:true, hp} | null
let current = 0, next = 0;
let moves = 0, score = 0;
let rng = mkRng(1);
let state = 'menu';      // menu | play | resolving | win | lose
let particles = [], rings = [], popups = [];
let shake = 0;
let busy = false;        // input lock during resolve animation
let gen = 0;             // bumped each startLevel to cancel stale cascade timers

function mkRng(seed){ let s = seed>>>0 || 1; return ()=>{ s=(s*1664525+1013904223)>>>0; return s/4294967296; }; }
function drawTier(){ return level.pool[Math.floor(rng()*level.pool.length)]; }

// ---------- start / build level ----------
function startLevel(lv){
  gen++;                 // invalidate any pending cascade timers from a prior run
  level = lv;
  rng = mkRng(lv.seed);
  grid = emptyGrid();
  for(const [r,c] of lv.stones) grid[r][c] = { stone:true, hp:1 };
  moves = lv.moves; score = 0;
  current = drawTier(); next = drawTier();
  particles=[]; rings=[]; popups=[]; shake=0; busy=false;
  state = 'play';
  winScreen.classList.remove('show'); loseScreen.classList.remove('show');
  levelSelect.classList.remove('show');
  gameWrap.classList.remove('hidden');
  updateHUD();
}

function goalString(g){
  if(g.type==='reach') return `Make a <b>${g.n+1}</b>`;
  if(g.type==='score') return `Score <b>${g.n}</b>`;
  if(g.type==='clear') return `Clear all <b>stones</b>`;
  return '';
}
function updateHUD(){
  goalText.innerHTML = 'Goal: ' + goalString(level.goal);
  movesVal.textContent = moves;
  movesVal.classList.toggle('low', moves<=3);
  scoreVal.textContent = score;
}

// ---------- core: drop ----------
function dropRow(c){
  if(grid[0][c]!==null) return -1;       // column blocked at the very top
  let r=0;
  while(r+1<ROWS && grid[r+1][c]===null) r++;
  return r;
}
function tryDrop(c){
  if(state!=='play' || busy) return;
  const r = dropRow(c);
  if(r<0){ blip(120,0.06,'square',0.12); return; } // invalid
  ensureAudio();
  grid[r][c] = { tier: current, py: gridY - cell*0.5, pop:0 };
  moves--;
  dropSound();
  current = next; next = drawTier();
  updateHUD();
  resolveBoard(c);
}

// flood fill connected same-tier component containing (r,c)
function component(r,c,tier,seen){
  const stack=[[r,c]], cells=[];
  while(stack.length){
    const [y,x]=stack.pop(); const key=y*COLS+x;
    if(seen.has(key)) continue;
    const o=grid[y][x];
    if(!o || o.stone || o.tier!==tier) continue;
    seen.add(key); cells.push([y,x]);
    if(y>0) stack.push([y-1,x]); if(y<ROWS-1) stack.push([y+1,x]);
    if(x>0) stack.push([y,x-1]); if(x<COLS-1) stack.push([y,x+1]);
  }
  return cells;
}
function findMerge(){
  const seen=new Set();
  for(let r=0;r<ROWS;r++) for(let c=0;c<COLS;c++){
    const o=grid[r][c];
    if(!o||o.stone||seen.has(r*COLS+c)) continue;
    const comp = component(r,c,o.tier,seen);
    if(comp.length>=2) return {cells:comp, tier:o.tier};
  }
  return null;
}
function gravity(){
  for(let c=0;c<COLS;c++){
    let write=ROWS-1;
    for(let r=ROWS-1;r>=0;r--){
      const o=grid[r][c];
      if(o&&o.stone){ write=r-1; }
      else if(o){ if(write!==r){ grid[write][c]=o; grid[r][c]=null; } write--; }
    }
  }
}
function resolveBoard(dropCol){
  busy=true;
  let combo=0;
  const myGen=gen;
  function step(){
    if(myGen!==gen) return;            // a new level started — abandon this cascade
    const m=findMerge();
    if(!m){ finishResolve(); return; }
    combo++;
    const t=m.tier, nt=Math.min(MAX_TIER, t+1);
    // anchor = lowest cell, tiebreak nearest the drop column
    let anchor=m.cells[0];
    for(const cl of m.cells){ if(cl[0]>anchor[0] || (cl[0]===anchor[0] && Math.abs(cl[1]-dropCol)<Math.abs(anchor[1]-dropCol))) anchor=cl; }
    // crack adjacent stones
    for(const [y,x] of m.cells){
      for(const [dy,dx] of [[1,0],[-1,0],[0,1],[0,-1]]){
        const ny=y+dy, nx=x+dx;
        if(ny<0||ny>=ROWS||nx<0||nx>=COLS) continue;
        const s=grid[ny][nx];
        if(s&&s.stone){ s.hp--; if(s.hp<=0){ grid[ny][nx]=null; spawnPop(cellCX(nx),cellCY(ny),'CRACK','#9aa0d4'); burst(cellCX(nx),cellCY(ny),'#9aa0d4',12); } }
      }
    }
    // remove component, place merged orb at anchor
    for(const [y,x] of m.cells) grid[y][x]=null;
    const mergedTopExisting = grid[anchor[0]][anchor[1]];
    grid[anchor[0]][anchor[1]] = { tier:nt, py:cellCY(anchor[0]), pop:1 };
    // score + fx
    const gain = (nt+1)*10*combo*m.cells.length;
    score += gain;
    const cx=cellCX(anchor[1]), cy=cellCY(anchor[0]);
    spawnPop(cx, cy-ORB_R-4, '+'+gain, TIERS[nt].color);
    if(combo>=2) spawnPop(cx, cy-ORB_R-22, 'CHAIN x'+combo, '#ffd45e');
    burst(cx,cy,TIERS[nt].glow, 14+nt*2);
    rings.push({x:cx,y:cy,r:ORB_R*0.6,maxR:ORB_R*2.6,color:TIERS[nt].glow,life:1,speed:2.2});
    shake=Math.min(12,4+combo*1.5);
    mergeSound(nt, combo-1);
    gravity();
    updateHUD();
    setTimeout(step, 150);   // brief beat between cascade steps (visual)
  }
  setTimeout(step, 110);
}
function finishResolve(){
  busy=false;
  if(checkGoal()){ win(); return; }
  if(moves<=0){ lose(); return; }
  if(boardFull()){ lose(); return; }
}
function boardFull(){ for(let c=0;c<COLS;c++) if(grid[0][c]===null) return false; return true; }
function maxTierOnBoard(){ let m=-1; for(let r=0;r<ROWS;r++) for(let c=0;c<COLS;c++){ const o=grid[r][c]; if(o&&!o.stone&&o.tier>m) m=o.tier; } return m; }
function stoneCount(){ let n=0; for(let r=0;r<ROWS;r++) for(let c=0;c<COLS;c++){ const o=grid[r][c]; if(o&&o.stone) n++; } return n; }
function checkGoal(){
  const g=level.goal;
  if(g.type==='reach') return maxTierOnBoard()>=g.n;
  if(g.type==='score') return score>=g.n;
  if(g.type==='clear') return stoneCount()===0;
  return false;
}

// ---------- win / lose ----------
function starsForWin(){
  const frac = moves / level.moves;       // moves remaining fraction
  if(frac >= 0.34) return 3;
  if(frac > 0)     return 2;
  return 1;
}
function win(){
  state='win';
  const stars = starsForWin();
  const prev = progress.stars[level.id]||0;
  if(stars>prev) progress.stars[level.id]=stars;
  if(level.id+1 > progress.unlocked && level.id < LEVELS.length) progress.unlocked = level.id+1;
  saveProgress();
  winStars.textContent = '★★★☆☆☆'.slice(3-stars, 6-stars);
  winMsg.textContent = stars===3 ? 'Flawless — three stars!' : (stars===2 ? 'Solved! Can you do it in fewer moves?' : 'Solved on the wire!');
  document.getElementById('winNext').classList.toggle('hidden', level.id>=LEVELS.length);
  setTimeout(()=>winScreen.classList.add('show'), 250);
  blip(523,0.13,'triangle',0.18); setTimeout(()=>blip(784,0.16,'triangle',0.16),110); setTimeout(()=>blip(1046,0.2,'triangle',0.14),230);
}
function lose(){
  state='lose';
  document.getElementById('loseMsg').textContent = boardFull() ? 'The board filled up — clear it faster.' : 'Out of moves — try a different order.';
  setTimeout(()=>loseScreen.classList.add('show'), 250);
  blip(160,0.3,'sawtooth',0.16);
}

// ---------- effects ----------
// NOTE: effects use Math.random (visual only) — never the seeded `rng`, so the
// level's orb sequence stays deterministic regardless of particles/frames.
function burst(x,y,color,n){ for(let i=0;i<n;i++){ const a=Math.random()*6.28, sp=1+Math.random()*4;
  particles.push({x,y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp-1,life:1,color,r:1.5+Math.random()*2.5}); }
  if(particles.length>240) particles.splice(0,particles.length-240); }
function spawnPop(x,y,t,c){ popups.push({x,y,t,c,life:1}); }
function updateFx(){
  for(const p of particles){ p.vy+=0.12; p.x+=p.vx; p.y+=p.vy; p.vx*=0.96; p.life-=0.025; }
  particles=particles.filter(p=>p.life>0);
  for(const t of popups){ t.y-=0.6; t.life-=0.016; }
  popups=popups.filter(t=>t.life>0);
  for(const r of rings){ r.r+=(r.maxR-r.r)*0.2; r.life-=0.05*r.speed; }
  rings=rings.filter(r=>r.life>0);
  if(shake>0.3) shake*=0.85; else shake=0;
  // ease orb fall + pop
  for(let r=0;r<ROWS;r++) for(let c=0;c<COLS;c++){ const o=grid[r][c]; if(o&&!o.stone){
    const ty=cellCY(r); if(o.py===undefined) o.py=ty; o.py+=(ty-o.py)*0.4; if(o.pop>0) o.pop=Math.max(0,o.pop-0.08); } }
}

// ---------- render ----------
function roundRect(x,y,w,h,r){ ctx.beginPath(); ctx.moveTo(x+r,y); ctx.arcTo(x+w,y,x+w,y+h,r); ctx.arcTo(x+w,y+h,x,y+h,r); ctx.arcTo(x,y+h,x,y,r); ctx.arcTo(x,y,x+w,y,r); ctx.closePath(); }
function drawOrb(x,y,r,tier){
  const t=TIERS[tier];
  ctx.save(); ctx.shadowColor=t.glow; ctx.shadowBlur=14;
  const g=ctx.createRadialGradient(x-r*0.35,y-r*0.4,r*0.1,x,y,r);
  g.addColorStop(0,'#fff'); g.addColorStop(0.28,t.color); g.addColorStop(1,t.glow);
  ctx.fillStyle=g; ctx.beginPath(); ctx.arc(x,y,r,0,6.2832); ctx.fill(); ctx.shadowBlur=0;
  ctx.globalAlpha=0.5; ctx.fillStyle='#fff'; ctx.beginPath(); ctx.arc(x-r*0.32,y-r*0.36,r*0.22,0,6.2832); ctx.fill(); ctx.globalAlpha=1;
  // number
  const fs=Math.max(11,Math.round(r*0.95));
  ctx.font='800 '+fs+'px system-ui'; ctx.textAlign='center'; ctx.textBaseline='middle';
  ctx.lineWidth=Math.max(2,fs*0.14); ctx.strokeStyle='rgba(255,255,255,.5)'; ctx.fillStyle='rgba(25,20,45,.82)';
  ctx.strokeText(tier+1,x,y); ctx.fillText(tier+1,x,y);
  ctx.restore();
}
function drawStone(x,y,r){
  ctx.save(); ctx.fillStyle='#3a3d55'; ctx.strokeStyle='#565a78'; ctx.lineWidth=2;
  roundRect(x-r,y-r,r*2,r*2,6); ctx.fill(); ctx.stroke();
  ctx.fillStyle='rgba(255,255,255,.08)'; roundRect(x-r*0.6,y-r*0.7,r*1.2,r*0.5,4); ctx.fill();
  ctx.restore();
}
let pointerCol=-1;
function render(){
  ctx.clearRect(0,0,W,H);
  ctx.save();
  if(shake>0) ctx.translate((Math.random()-.5)*shake,(Math.random()-.5)*shake);

  // grid frame
  ctx.fillStyle='rgba(255,255,255,.04)'; roundRect(gridX-6,gridY-6,gridW+12,gridH+12,14); ctx.fill();
  // column highlight under pointer
  if(state==='play' && pointerCol>=0){ ctx.fillStyle='rgba(255,255,255,.06)'; ctx.fillRect(gridX+pointerCol*cell,gridY,cell,gridH); }
  // cell guides
  ctx.strokeStyle='rgba(255,255,255,.05)'; ctx.lineWidth=1;
  for(let c=0;c<=COLS;c++){ ctx.beginPath(); ctx.moveTo(gridX+c*cell,gridY); ctx.lineTo(gridX+c*cell,gridY+gridH); ctx.stroke(); }
  for(let r=0;r<=ROWS;r++){ ctx.beginPath(); ctx.moveTo(gridX,gridY+r*cell); ctx.lineTo(gridX+gridW,gridY+r*cell); ctx.stroke(); }

  // orbs / stones
  for(let r=0;r<ROWS;r++) for(let c=0;c<COLS;c++){ const o=grid[r][c]; if(!o) continue;
    const x=cellCX(c);
    if(o.stone){ drawStone(x,cellCY(r),ORB_R); }
    else { const y=(o.py!==undefined)?o.py:cellCY(r); const pop=1+(o.pop||0)*0.3; drawOrb(x,y,ORB_R*pop,o.tier); }
  }

  // rings + particles (additive)
  ctx.globalCompositeOperation='lighter';
  for(const rg of rings){ ctx.globalAlpha=Math.max(0,rg.life)*0.6; ctx.strokeStyle=rg.color; ctx.lineWidth=2+3*rg.life; ctx.beginPath(); ctx.arc(rg.x,rg.y,rg.r,0,6.2832); ctx.stroke(); }
  ctx.lineCap='round';
  for(const p of particles){ ctx.globalAlpha=Math.max(0,p.life); ctx.strokeStyle=p.color; ctx.lineWidth=p.r; ctx.beginPath(); ctx.moveTo(p.x,p.y); ctx.lineTo(p.x-p.vx*2,p.y-p.vy*2); ctx.stroke(); }
  ctx.globalCompositeOperation='source-over'; ctx.globalAlpha=1;

  // current + next orb (above the grid)
  if(state==='play' || state==='resolving'){
    const cy=42;
    // aim guide
    if(pointerCol>=0){ ctx.globalAlpha=0.25; ctx.strokeStyle=TIERS[current].color; ctx.lineWidth=2; ctx.setLineDash([5,7]);
      ctx.beginPath(); ctx.moveTo(cellCX(pointerCol),cy+ORB_R); ctx.lineTo(cellCX(pointerCol),gridY+gridH); ctx.stroke(); ctx.setLineDash([]); ctx.globalAlpha=1; }
    const cx = pointerCol>=0 ? cellCX(pointerCol) : W/2;
    drawOrb(cx, cy, ORB_R, current);
    // next
    ctx.fillStyle='rgba(255,255,255,.5)'; ctx.font='700 9px system-ui'; ctx.textAlign='right'; ctx.fillText('NEXT', W-44, cy-12);
    drawOrb(W-24, cy, ORB_R*0.6, next);
  }

  // popups
  for(const t of popups){ ctx.globalAlpha=Math.max(0,t.life); ctx.fillStyle=t.c; ctx.font='800 15px system-ui'; ctx.textAlign='center'; ctx.fillText(t.t,t.x,t.y); }
  ctx.globalAlpha=1;
  ctx.restore();
}
function loop(){ requestAnimationFrame(loop); updateFx(); render(); }

// ---------- input ----------
function colFromX(clientX){
  const rect=canvas.getBoundingClientRect();
  const x=(clientX-rect.left)*(W/rect.width);
  if(x<gridX||x>=gridX+gridW) return -1;
  return Math.floor((x-gridX)/cell);
}
canvas.addEventListener('mousemove', e=>{ pointerCol=colFromX(e.clientX); });
canvas.addEventListener('mouseleave', ()=>{ pointerCol=-1; });
canvas.addEventListener('mousedown', e=>{ const c=colFromX(e.clientX); pointerCol=c; if(c>=0) tryDrop(c); });
canvas.addEventListener('touchstart', e=>{ const c=colFromX(e.touches[0].clientX); pointerCol=c; if(c>=0) tryDrop(c); e.preventDefault(); }, {passive:false});
canvas.addEventListener('touchmove', e=>{ pointerCol=colFromX(e.touches[0].clientX); e.preventDefault(); }, {passive:false});

// ---------- level select ----------
function buildLevelSelect(){
  levelGrid.innerHTML='';
  LEVELS.forEach(lv=>{
    const locked = lv.id>progress.unlocked;
    const el=document.createElement('div');
    el.className='lvl'+(locked?' locked':'');
    const st=progress.stars[lv.id]||0;
    el.innerHTML = locked ? `<div class="num">🔒</div><div class="st"></div>`
      : `<div class="num">${lv.id}</div><div class="st">${st?'★'.repeat(st):''}</div>`;
    if(!locked) el.addEventListener('click', ()=>{ ensureAudio(); startLevel(lv); });
    levelGrid.appendChild(el);
  });
}
function showMenu(){ state='menu'; gameWrap.classList.add('hidden'); winScreen.classList.remove('show'); loseScreen.classList.remove('show');
  buildLevelSelect(); levelSelect.classList.add('show'); }

document.getElementById('homeBtn').addEventListener('click', showMenu);
document.getElementById('winRetry').addEventListener('click', ()=>startLevel(level));
document.getElementById('winNext').addEventListener('click', ()=>{ const nx=LEVELS.find(l=>l.id===level.id+1); if(nx) startLevel(nx); else showMenu(); });
document.getElementById('loseRetry').addEventListener('click', ()=>startLevel(level));
document.getElementById('loseMenu').addEventListener('click', showMenu);

// expose for testing
window.OrbitPuzzle = {
  state:()=>({ state, moves, score, busy, maxTier:maxTierOnBoard(), stones:stoneCount(),
               win: winScreen.classList.contains('show'), lose: loseScreen.classList.contains('show') }),
  drop:(c)=>tryDrop(c), start:(id)=>startLevel(LEVELS.find(l=>l.id===id)||LEVELS[0]), levels:LEVELS,
  COLS, ROWS, current:()=>current, dropRow:(c)=>dropRow(c),
  grid:()=>grid.map(row=>row.map(o=>o?(o.stone?{stone:1}:{tier:o.tier}):null)),
};

buildLevelSelect();
requestAnimationFrame(loop);
})();
</script>
</body>
